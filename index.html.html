<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Калькулятор сети</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#17202a}
.container{max-width:900px;margin:35px auto;padding:0 18px}
body.dark{background:#11171d;color:#edf2f5}
body.dark .card{background:#1b242c;border-color:#303b45;box-shadow:0 8px 28px rgba(0,0,0,.25)}
body.dark .subtitle, body.dark label, body.dark footer{color:#aeb8c0}
body.dark input{background:#121920;color:#edf2f5;border-color:#46535e}
body.dark input:focus{border-color:#90a4ae}
body.dark button.secondary{background:#303b45;color:#edf2f5}
body.dark .item{background:#222d36}
body.dark pre{background:#0b1014}
body.dark .host{background:#27323b}
body.dark .yes{background:#173a22;color:#9be0aa}
body.dark .no{background:#401c1c;color:#ffb0b0}
.theme-toggle{float:right;margin-top:-2px}
.card{background:#fff;border:1px solid #dfe4e8;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.06);margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px}
.subtitle{margin:0 0 22px;color:#65727e}
.grid{display:grid;grid-template-columns:1fr 180px;gap:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#46515c}
input{width:100%;padding:13px 14px;border:1px solid #cfd6dc;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#607d8b;box-shadow:0 0 0 3px rgba(96,125,139,.12)}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#263238;color:#fff}
button.secondary{background:#e9edf0;color:#263238}
button.small{padding:8px 12px;font-size:13px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{margin-top:14px;padding:12px;border-radius:10px;display:none;font-weight:600}
.error{background:#fff0f0;color:#b42318;border:1px solid #f2b8b5}
.success{background:#effaf1;color:#237a35;border:1px solid #b9dfbf}
.result{display:none}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{padding:13px;background:#f7f9fa;border-radius:10px}
.item span{display:block;color:#69757f;font-size:12px;margin-bottom:4px}
.item strong{font-size:15px;word-break:break-word}
h2{font-size:19px;margin:0 0 15px}
pre{white-space:pre-wrap;background:#17202a;color:#f3f5f7;padding:16px;border-radius:10px;line-height:1.55;margin:0;font-family:Consolas,monospace}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.result-badge{margin-top:12px;padding:12px;border-radius:10px;font-weight:700}
.yes{background:#eaf8ed;color:#26733a}.no{background:#fff1f1;color:#a32222}
.hosts{margin-top:14px;max-height:240px;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.host{padding:8px;background:#f4f6f8;border-radius:7px;font-family:Consolas,monospace;font-size:13px}
footer{text-align:center;color:#7b8790;font-size:12px;margin:18px}
@media(max-width:650px){.grid,.check-grid,.result-grid{grid-template-columns:1fr}.hosts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<button id="themeBtn" class="secondary theme-toggle" onclick="toggleTheme()">🌙 Тёмная тема</button>
<h1>IP Калькулятор сети</h1>
<p class="subtitle">IPv4 / CIDR калькулятор для сетевой диагностики</p>

<div class="grid">
<div>
<label for="ip">IP-адрес / CIDR</label>
<input id="ip" placeholder="Например: 10.1.37.32/28">
</div>
<div>
<label for="prefix">Префикс</label>
<input id="prefix" placeholder="/28">
</div>
</div>

<div class="examples">
<button class="small secondary" onclick="example('/30')">10.15.219.64/30</button>
<button class="small secondary" onclick="example('/28')">10.1.37.32/28</button>
<button class="small secondary" onclick="example('/24')">192.168.1.0/24</button>
</div>

<div class="buttons">
<button onclick="calculate()">Рассчитать</button>
<button class="secondary" onclick="clearAll()">Очистить</button>
</div>
<div id="status" class="status"></div>
</div>

<div id="result" class="card result">
<h2>Результат расчёта</h2>
<div class="result-grid" id="resultGrid"></div>
<div class="buttons">
<button onclick="copyResult()">Копировать результат</button>
<button class="secondary" onclick="showHosts()">Показать адреса</button>
</div>
<div id="hosts" class="hosts"></div>
</div>

<div class="card">
<h2>Проверка IP в подсети</h2>
<div class="check-grid">
<div><label for="subnet">Подсеть</label><input id="subnet" placeholder="Например: 10.1.37.32/28"></div>
<div><label for="checkIp">IP-адрес</label><input id="checkIp" placeholder="Например: 10.1.37.40"></div>
</div>
<div class="buttons"><button onclick="checkMembership()">Проверить</button></div>
<div id="checkResult"></div>
</div>

<footer>IP Сеть Calculator • работает полностью локально в браузере</footer>
</div>

<script>
let currentСеть=null;
let currentResultText='';

function parseIPv4(s){
  const p = s.trim().split('.');
  if(
    p.length !== 4 ||
    p.some(x => x === '' || !/^\d+$/.test(x) || Number(x) < 0 || Number(x) > 255)
  ){
    throw new Error('Некорректный IPv4-адрес.');
  }
  return p.map(Number);
}
function ipToInt(a){return (((a[0]<<24)>>>0)+(a[1]<<16)+(a[2]<<8)+a[3])>>>0}
function intToIp(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}
function maskInt(prefix){return prefix===0?0:(0xFFFFFFFF << (32-prefix))>>>0}
function parseCIDR(ipText,prefixText){
  let ip = ipText.trim();
  let pr = prefixText.trim();

  if(ip.includes('/')){
    const parts = ip.split('/');
    if(parts.length !== 2){
      throw new Error('Некорректная запись CIDR.');
    }
    ip = parts[0].trim();
    if(!pr) pr = parts[1].trim();
  }

  if(!ip || !pr){
    throw new Error('Введите IP-адрес и префикс.');
  }

  pr = pr.replace(/^\/+/, '').trim();

  if(!/^\d+$/.test(pr) || Number(pr) < 0 || Number(pr) > 32){
    throw new Error('Префикс должен быть от /0 до /32.');
  }

  const oct = parseIPv4(ip);
  const prefix = Number(pr);
  const value = ipToInt(oct);
  const mask = maskInt(prefix);
  const network = (value & mask) >>> 0;
  const broadcast = (network | (~mask >>> 0)) >>> 0;

  return {
    ip: ip,
    prefix: prefix,
    mask: mask,
    network: network,
    broadcast: broadcast
  };
}
function networkType(p){return p===32?'Хост':(p===30||p===31?'P2P':'LAN')}
function calculate(){
  hideStatus();
  try{
    const ipText = document.getElementById('ip').value.trim();
    const prefixText = document.getElementById('prefix').value.trim();

    if(!ipText){
      throw new Error('Введите IP-адрес и префикс.');
    }

    const n = parseCIDR(ipText, prefixText);
    currentNetwork = n;

    const total = Math.pow(2, 32 - n.prefix);
    let usable;

    if(n.prefix === 32){
      usable = 1;
    } else if(n.prefix === 31){
      usable = 2;
    } else {
      usable = Math.max(0, total - 2);
    }

    let first, last;
    if(n.prefix === 32){
      first = n.network;
      last = n.network;
    } else if(n.prefix === 31){
      first = n.network;
      last = n.broadcast;
    } else {
      first = n.network + 1;
      last = n.broadcast - 1;
    }

    const mask = intToIp(n.mask);
    const wildcard = intToIp((~n.mask) >>> 0);

    const data = [
      ['Сеть', intToIp(n.network)],
      ['Широковещательный адрес', intToIp(n.broadcast)],
      ['Маска подсети', mask],
      ['Wildcard-маска', wildcard],
      ['Первый хост', intToIp(first)],
      ['Последний хост', intToIp(last)],
      ['Всего адресов', total.toLocaleString('ru-RU')],
      ['Доступно хостов', usable.toLocaleString('ru-RU')],
      ['CIDR', '/' + n.prefix],
      ['Тип сети', networkType(n.prefix)]
    ];

    document.getElementById('resultGrid').innerHTML =
      data.map(x =>
        '<div class="item"><span>' + x[0] + '</span><strong>' + x[1] + '</strong></div>'
      ).join('');

    currentResultText = data.map(x => x[0] + ': ' + x[1]).join('\n');

    document.getElementById('result').style.display = 'block';
    document.getElementById('hosts').innerHTML = '';
    showStatus('Расчёт выполнен.', 'success');

  } catch(e) {
    document.getElementById('result').style.display = 'none';
    showStatus(e.message || 'Произошла ошибка при расчёте.', 'error');
  }
}
function showHosts(){
  if(!currentСеть)return;
  const n=currentСеть;
  const total=n.prefix===32?1:2**(32-n.prefix);
  const box=document.getElementById('hosts');
  if(total>256){box.innerHTML='<div style="grid-column:1/-1;padding:12px">Подсеть слишком большая для вывода всех адресов.</div>';return}
  let start=n.network, end=n.broadcast;
  if(n.prefix>=1 && n.prefix<=30){start=n.network+1;end=n.broadcast-1}
  let html='';
  for(let i=start;i<=end;i++) html+=`<div class="host">${intToIp(i)}</div>`;
  box.innerHTML=html;
}
function copyResult(){
  if(!currentResultText)return;
  navigator.clipboard.writeText(currentResultText).then(()=>showStatus('Результат скопирован в буфер обмена.','success'));
}
function checkMembership(){
  const sub=document.getElementById('subnet').value.trim(), ip=document.getElementById('checkIp').value.trim();
  const out=document.getElementById('checkResult');
  try{
    const n=parseCIDR(sub,'');
    const value=ipToInt(parseIPv4(ip));
    const yes=value>=n.network && value<=n.broadcast;
    out.innerHTML=`<div class="result-badge ${yes?'yes':'no'}">${ip} ${yes?'входит в':'не входит в'} ${intToIp(n.network)}/${n.prefix}<br><br>Result: ${yes?'YES':'NO'}</div>`;
  }catch(e){out.innerHTML=`<div class="status error" style="display:block">${e.message}</div>`}
}
function example(type){
  const examples={'/30':'10.15.219.64','/28':'10.1.37.32','/24':'192.168.1.0'};
  document.getElementById('ip').value=examples[type]+'/'+type.slice(1);
  document.getElementById('prefix').value='';
  calculate();
}
function clearAll(){
  ['ip','prefix','subnet','checkIp'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('result').style.display='none';
  document.getElementById('hosts').innerHTML='';
  document.getElementById('checkResult').innerHTML='';
  hideStatus();
  currentСеть=null;currentResultText='';
}
function showStatus(text,type){
  const s=document.getElementById('status');s.textContent=text;s.className='status '+type;s.style.display='block';
}
function hideStatus(){document.getElementById('status').style.display='none'}

function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  const b=document.getElementById('themeBtn');
  b.textContent=dark?'☀️ Светлая тема':'🌙 Тёмная тема';
  localStorage.setItem('ipCalcTheme', dark?'dark':'light');
}
function toggleTheme(){
  applyTheme(!document.body.classList.contains('dark'));
}
(function(){
  const saved=localStorage.getItem('ipCalcTheme');
  applyTheme(saved==='dark');
})();
</script>
</body>
</html>
